[mpc-frame]
id = "mpc-frame"
display_name = "MPC Frame"
description = "Multi-project chip frame template and reference SoC design."
category = "mpc"
homepage = "https://github.com/openecos-projects/mpc-frame"
platform = "all-platform"
src = { git = "https://github.com/openecos-projects/mpc-frame", branch = "main" }
url_template = "https://github.com/openecos-projects/mpc-frame/archive/{version}.tar.gz"
# Seed state: the locked version is the 0.1.0 seed while the locked url and
# the extracted directory embed the upstream commit. The url_template
# consistency check is exempted (nix/_sources/locks.nix) and strip_prefix stays static
# until the first bump advances the version to commit form.
strip_prefix = "mpc-frame-01ac0615e3b6d73db605afaf7c67851ef0cf5767"
update_source = { type = "github_branch", branch = "main" }
