name: Check
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  check:
    name: Flake checks and registry URL reachability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Run flake checks
        run: nix flake check
      - name: Check registry URLs
        run: |
          nix build .#tool-registry
          nix run .#check-registry-urls -- result
