name: Publish tool registry
on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - nix/**
      - lib/**
      - .github/workflows/publish-registry.yml
  workflow_dispatch:
concurrency:
  group: publish-registry
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    name: Build registry JSON
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build registry JSON
        run: nix build .#tool-registry
      - name: Check registry URLs
        run: nix run .#check-registry-urls -- result
      - name: Record output checksum
        id: hash
        run: echo "sha256=$(sha256sum result | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Stage pages artifact
        run: |
          mkdir site
          cp result site/tool-registry.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Stage registry artifact
        run: |
          mkdir out
          cp result out/tool-registry.json
      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-registry
          path: out/tool-registry.json
          retention-days: 1
  deploy-pages:
    name: Deploy registry to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-new:
    name: Verify new URL serves the built bytes
    needs: [build, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Poll the new URL for the built checksum
        env:
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          url="https://emin017.github.io/ecos-release/tool-registry.json"
          for attempt in $(seq 1 30); do
            if got="$(curl -fsSL --max-time 20 "$url" | sha256sum | cut -d' ' -f1)" && [ "$got" = "$SHA" ]; then
              echo "new URL serves sha256 $got"
              exit 0
            fi
            sleep 10
          done
          echo "new URL did not serve sha256 $SHA within 5 minutes" >&2
          exit 1
  sync-legacy-pr:
    name: Sync legacy registry via pull request
    needs: [build, verify-new]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ecos-registry
        uses: actions/checkout@v4
        with:
          repository: Emin017/ecos-registry
          token: ${{ secrets.REGISTRY_SYNC_TOKEN }}
      - name: Download registry artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-registry
          path: artifact
      - name: Verify artifact checksum
        env:
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$SHA  artifact/tool-registry.json" | sha256sum -c -
      - name: Detect changes
        id: diff
        run: |
          cp artifact/tool-registry.json tool-registry.json
          if git diff --quiet -- tool-registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "legacy registry already matches; nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push sync branch
        if: steps.diff.outputs.changed == 'true'
        env:
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/tool-registry-sync
          git commit -am "Sync tool-registry.json from ecos-release

          Artifact sha256: $SHA"
          git push --force origin bot/tool-registry-sync
      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_SYNC_TOKEN }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          body="$(mktemp)"
          {
            echo "Automated sync of \`tool-registry.json\` generated by"
            echo "[ecos-release](https://github.com/openecos-projects/ecos-installer)."
            echo
            echo "Artifact sha256: \`$SHA\`"
            echo
            echo "Merging keeps the legacy URL byte-identical with"
            echo "https://emin017.github.io/ecos-release/tool-registry.json."
          } > "$body"
          existing="$(gh pr list --repo Emin017/ecos-registry --head bot/tool-registry-sync \
            --state open --json number --jq 'if length > 0 then .[0].number else empty end')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo Emin017/ecos-registry --body-file "$body"
          else
            gh pr create --repo Emin017/ecos-registry --base main --head bot/tool-registry-sync \
              --title "Sync tool-registry.json from ecos-release" --body-file "$body"
          fi
