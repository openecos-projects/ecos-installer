name: Publish ECC installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact ECC tag to publish, for example v0.1.0-alpha.11
        required: true
        type: string
concurrency:
  group: installer-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    name: Validate and publish installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Pin ECC tag
        run: nix run .#update-ecc -- ${{ inputs.tag }}
      - name: Run flake checks
        run: nix flake check
      - name: Build installer
        run: nix build .#ecc-installer
      - name: Publish to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ecc-install-script
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          OSS_PUBLIC_BASE: https://ecc-install-script.oss-cn-beijing.aliyuncs.com
        run: nix run .#publish-oss -- ${{ inputs.tag }}
