name: Publish ECC installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact ECC tag to publish, for example v0.1.0-alpha.11
        required: true
        type: string
  # Auto-publish after a bump merge: only when the ecc lock version changed
  # (the installer's version identity is the ecc version; other components'
  # drift never triggers this). The change check compares the ecc version
  # against the previous commit, which covers squash and merge commits.
  push:
    branches:
      - main
    paths:
      - nix/_sources/generated.json
concurrency:
  group: installer-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Keep detection in an ungated job so the installer-deploy approval is only
  # requested when there is actually something to publish.
  resolve:
    name: Resolve tag and decide
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            before="$(git show HEAD~1:nix/_sources/generated.json | jq -r .ecc.version)"
            now="$(jq -r .ecc.version nix/_sources/generated.json)"
            echo "ecc lock version: $before -> $now"
            if [ "$before" = "$now" ]; then
              echo "ecc version unchanged; skipping publish"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            else
              echo "tag=$now" >> "$GITHUB_OUTPUT"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
  # Check, build, and upload the installer before anyone approves anything, so
  # the reviewer can download the exact bytes that will be published.
  build:
    name: Check and build installer
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Pin ECC tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: nix run .#update-ecc -- ${{ needs.resolve.outputs.tag }}
      - name: Run flake checks
        run: nix flake check
      - name: Build installer
        run: nix build .#ecc-installer
      - name: Stage installer artifact
        run: |
          mkdir out
          cp result out/ecc-installer.sh
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecc-installer
          path: out/ecc-installer.sh
          # Must outlive the approval wait on installer-deploy.
          retention-days: 30
  publish:
    name: Publish to OSS
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # Push-triggered (bump merge) runs wait for a required reviewer on the
    # installer-deploy environment; manual dispatches are approved by the
    # dispatch itself.
    environment: ${{ github.event_name == 'push' && 'installer-deploy' || 'installer-manual' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - name: Magic Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ecc-installer
          path: artifact
      # publish-oss derives the tag from the script's ECC_VERSION when given a
      # file path; keep the lock-to-artifact consistency check explicit.
      - name: Verify the artifact matches the resolved tag
        run: |
          version="$(sed -n 's/^ECC_VERSION="\(.*\)"/\1/p' artifact/ecc-installer.sh | head -n1)"
          test "v$version" = "${{ needs.resolve.outputs.tag }}"
      - name: Publish to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_PUBLIC_BASE: ${{ vars.OSS_PUBLIC_BASE }}
        run: nix run .#publish-oss -- artifact/ecc-installer.sh
