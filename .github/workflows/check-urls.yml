name: Check registry URLs
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  check-urls:
    name: Check registry download URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build registry JSON
        run: nix build .#tool-registry
      - name: Check registry URLs
        run: nix run .#check-registry-urls -- result
