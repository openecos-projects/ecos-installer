# Single source of truth for every ECOS toolchain component.
#
# Each component table carries the registry metadata (name/display_name/
# description/category/homepage/requires) next to the build-time lock fields
# (version/url/sha256/size). Two Nix projections read this file:
#   - templates/ecc-installer.sh.in via nix/generate.nix (installer pins)
#   - nix/generate-registry.nix (tool-registry.json for ECOS Studio)
# Field sets per section are validated in nix/model.nix; unknown sections or
# fields fail the build.

[platform]
os = "linux"
cpu = "x86_64"
min_glibc = "2.34"

[ecc]
# registry metadata
name = "ecc"
display_name = "ECOS Chip Compiler"
description = "ECOS Chip Compiler (ECC) CLI integrating Yosys, ECC-DreamPlace, ECC-Tools, and KLayout for a complete RTL-to-GDS design flow."
category = "backend"
homepage = "https://github.com/openecos-projects/ecc"
requires = ["tool:yosys", "pdk:ics55"]
# installer-only fields consumed by nix/update-ecc.sh
github_repo = "openecos-projects/ecc"
asset_name = "ecc-cli-linux-x86_64.tar.gz"
cnb_url_template = "https://cnb.cool/ecoslab/ecc/-/releases/download/{tag}/{name}"
# lock fields
version = "0.1.0-alpha.12"
url = "https://github.com/openecos-projects/ecc/releases/download/v0.1.0-alpha.12/ecc-cli-linux-x86_64.tar.gz"
cnb_url = "https://cnb.cool/ecoslab/ecc/-/releases/download/v0.1.0-alpha.12/ecc-cli-linux-x86_64.tar.gz"
sha256 = "fb63d96bf83e999ace04c1d21c2e0767ab5452875651b7ccc5ddb9610c8180aa"
size = 513976534

[oss_cad_suite]
# registry metadata; the registry entity name differs from the section name
name = "yosys"
display_name = "Yosys"
description = "Yosys from the OSS CAD Suite distribution."
category = "synthesis"
homepage = "https://github.com/YosysHQ/oss-cad-suite-build"
requires = []
# lock fields; asset_name keeps the archive filename (installer-only)
version = "20260827"
asset_name = "oss-cad-suite-linux-x64-20260827.tgz"
url = "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-08-27/oss-cad-suite-linux-x64-20260827.tgz"
cnb_url = "https://cnb.cool/ecoslab/oss-cad-suite-build/-/releases/download/2026-08-27/oss-cad-suite-linux-x64-20260827.tgz"
sha256 = "c3ffafe1549d5bf321b85e6ac30b3bc6af0af72093d5f45117380bcc0645a8e2"
size = 740836017
strip_prefix = "oss-cad-suite"

[sizer]
# installer-only component; not projected into the registry
github_repo = "openecos-projects/ecc-sizer"
asset_name = "ecc-sizer-0.1.0-alpha-linux-x64.tar.gz"
version = "0.1.0-alpha"
url = "https://github.com/openecos-projects/ecc-sizer/releases/download/v0.1.0-alpha/ecc-sizer-0.1.0-alpha-linux-x64.tar.gz"
cnb_url = "https://cnb.cool/ecoslab/ecc-sizer/-/releases/download/v0.1.0-alpha/ecc-sizer-0.1.0-alpha-linux-x64.tar.gz"
sha256 = "d33a2167600711f35fb1dcef55983b0d669176988d8722ed8b22c03471dafee7"
size = 85803792

